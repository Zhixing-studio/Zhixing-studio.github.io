<title>知行工作室 | Zhixing Studio</title>
<meta name="description" content="知行工作室（Zhixing Studio）——独立游戏开发工作室，知行合一，用心做游戏。">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: "PingFang SC","Microsoft YaHei","Noto Serif SC",serif;
    background:#faf8f4; color:#2b2b2b; line-height:1.8;
  }
  .wrap { max-width:680px; margin:0 auto; padding:64px 24px 48px; text-align:center; }
  .logo { width:128px; height:128px; border-radius:24px; box-shadow:0 6px 24px rgba(0,0,0,.10); }
  h1 { font-size:34px; letter-spacing:8px; margin-top:28px; font-weight:600; }
  .en { color:#9a938a; font-size:14px; letter-spacing:3px; margin-top:6px; text-transform:uppercase; }
  .quote {
    margin:36px auto 0; padding:24px 20px; max-width:420px;
    color:#6d675e; font-size:16px; letter-spacing:2px;
    border-top:1px solid #e4ded4; border-bottom:1px solid #e4ded4;
  }
  .intro { margin-top:28px; color:#55504a; font-size:15px; text-align:justify; text-justify:inter-ideograph; }
  h2 { font-size:18px; letter-spacing:4px; margin:56px 0 20px; color:#3a352f; font-weight:600; }
  .games { display:flex; flex-direction:column; gap:14px; }
  .game {
    background:#fff; border:1px solid #ece6db; border-radius:14px;
    padding:22px 20px; text-align:left;
  }
  .game .gname { font-weight:600; font-size:17px; }
  .game .gtag { color:#9a938a; font-size:13px; margin-left:8px; }
  .game p { color:#6d675e; font-size:14px; margin-top:6px; }
  .links { margin-top:56px; display:flex; justify-content:center; gap:28px; flex-wrap:wrap; }
  .links a {
    color:#5b544b; text-decoration:none; font-size:14px; letter-spacing:1px;
    border-bottom:1px solid #d8d0c2; padding-bottom:3px; transition:color .2s;
  }
  .links a:hover { color:#111; border-color:#111; }
  footer { color:#b7afa2; font-size:12px; margin-top:48px; letter-spacing:1px; }
</style>
